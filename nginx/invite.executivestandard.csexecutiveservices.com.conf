# invite.executivestandard.csexecutiveservices.com -- the PUBLIC invite host for
# the members edition (2026-10-05). Sibling of agents.csexecutiveservices.com.
# Logic: ctdi-dispatch-internal/src/common/es_invites.py, served by the same
# loopback verifier as the members gate (127.0.0.1:8787), under /_invite.
# Reached only through the Cloudflare tunnel (CF terminates TLS; two-level name
# covered by the zone's Total TLS / ACM like members). Must NOT sit under a
# Cloudflare Access application -- readers have no Access identity.
#
# Exposes ONLY: /  /p  /i/<code>. Everything else is 404. A GET never spends a
# code (the verifier answers with a button that POSTs), so link previews and
# mail scanners cannot burn invites. POSTs and GETs share one tight per-client
# rate limit (promo codes are 50-bit; this makes guessing pointless).

limit_req_zone $ratelimit_addr zone=es_invite:1m rate=12r/m;   # $ratelimit_addr: 00-rate-limit-corporatetraveldc.conf (CF-Connecting-IP)

# The invite code IS the credential and sits in the path: log /i/- instead,
# and never the query string (promo prefill).
map $uri $es_invite_logpath { default $uri; "~^/i/" "/i/-"; }
log_format es_invite '$ratelimit_addr - [$time_local] "$request_method $es_invite_logpath" $status $body_bytes_sent';

server {
    listen 80;
    server_name invite.executivestandard.csexecutiveservices.com;

    include /etc/nginx/snippets/honeypot.conf;
    access_log /var/log/nginx/es-invite-access.log es_invite;
    error_log  /var/log/nginx/es-invite-error.log crit;   # error-level lines carry the request path
    client_max_body_size 4k;
    limit_req_status 429;

    # quoted: a bare { inside the regex would open the block
    location ~ "^/(|p|i/[A-Za-z0-9_-]{16,64})$" {
        limit_req zone=es_invite burst=10 nodelay;
        limit_except GET HEAD POST { deny all; }
        proxy_pass http://127.0.0.1:8787/_invite$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";                               # the invite host never needs cookies
        proxy_set_header X-Original-URI "";
        proxy_read_timeout 15s;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src https://members.executivestandard.csexecutiveservices.com; form-action 'self' https://members.executivestandard.csexecutiveservices.com; frame-ancestors 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex,nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / { return 404; }
}
