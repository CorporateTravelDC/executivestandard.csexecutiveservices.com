# Included at each serving location because any location that sets its own
# add_header drops ALL inherited ones (nginx rule). Keeps no-store/Vary on
# every gated response — the cache-bypass fix from the 2026-09-27 pass.
add_header X-Content-Type-Options nosniff always;
add_header Vary "Cookie, Accept" always;
add_header Cache-Control "private, no-store" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
